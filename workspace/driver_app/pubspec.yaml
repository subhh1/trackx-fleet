name: trackx_driver
description: TRACKX Driver Application - GPS Fleet Tracking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.15.5
  firebase_database: ^10.3.6
  cloud_functions: ^4.5.8
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.3
  mobile_scanner: ^3.5.5
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  permission_handler: ^11.1.0
  uuid: ^4.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
